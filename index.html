<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class Map — LISA Academy Arkansas Online School</title>
<style>
:root{
 --paper:#F7F8FA;--surface:#fff;--plane:#fff;--ink:#141821;--ink2:#333B49;--muted:#6B7484;
 --ring:#DFE3EA;--grid:#E8ECF2;--accent:#1D5FA8;--ok:#0F7B4F;--warn:#9A6B08;--bad:#A32F26;
}
html[data-theme=dark]{
 --paper:#12151B;--surface:#1A1E26;--plane:#1A1E26;--ink:#E8EBF0;--ink2:#C2C8D2;--muted:#8D96A5;
 --ring:#2C323D;--grid:#262C36;--accent:#6FA8E8;--ok:#5FBE8E;--warn:#D4A93C;--bad:#E08076;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
.shellbar{position:sticky;top:0;z-index:9;background:var(--surface);border-bottom:1px solid var(--ring);
 display:flex;align-items:center;gap:14px;padding:9px 18px;flex-wrap:wrap}
.brand{font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.coursepick{display:flex;flex-wrap:wrap;border:1px solid var(--ring);border-radius:9px;overflow:hidden}
.coursepick button{background:var(--surface);border:0;color:var(--ink2);font:inherit;font-size:12.5px;
 padding:7px 11px;cursor:pointer;line-height:1.25;text-align:left}
.coursepick button+button{border-left:1px solid var(--ring)}
.coursepick button small{display:block;font-size:10px;color:var(--muted)}
.coursepick button[aria-current=true]{background:var(--accent);color:#fff}
.coursepick button[aria-current=true] small{color:#fff;opacity:.82}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ring);border-radius:999px;
 padding:5px 11px;font-size:12px;color:var(--muted);background:var(--surface)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)}.dot.err{background:var(--bad)}
.ghost{background:var(--surface);border:1px solid var(--ring);border-radius:8px;color:var(--ink2);
 font:inherit;font-size:12.5px;padding:6px 11px;cursor:pointer}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:22px}
h2{margin:0 0 4px;font-size:25px;letter-spacing:-.02em}
.lede{color:var(--muted);font-size:13px;margin:0 0 20px;max-width:72ch}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--ring);margin:0 0 18px;flex-wrap:wrap}
.tab{border:0;background:none;font:inherit;font-size:13.5px;color:var(--muted);cursor:pointer;
 padding:8px 12px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:11px;margin:0 0 22px}
.stat{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:13px 15px}
.stat b{display:block;font-size:27px;letter-spacing:-.02em;line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted)}
.bars{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:16px 18px}
.barrow{display:grid;grid-template-columns:190px 1fr;gap:12px;align-items:center;margin-bottom:9px;font-size:12px}
.barlab{text-align:right;color:var(--ink2)}
.barlab small{display:block;color:var(--muted);font-size:10.5px}
.bar{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--grid)}
.bar i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;
 font-weight:700;color:#fff;min-width:0}
.bar .g{background:var(--ok)}.bar .y{background:var(--warn)}.bar .r{background:var(--bad)}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted);margin:0 0 12px;flex-wrap:wrap}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.search{width:100%;max-width:520px;padding:9px 12px;font:inherit;font-size:14px;border:1px solid var(--ring);
 border-radius:8px;background:var(--plane);color:var(--ink);margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface)}
th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
 font-weight:700;padding:7px 10px;border-bottom:1px solid var(--ring)}
td{padding:6px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
.grp td{background:var(--paper);font-weight:700;font-size:12px}
.sk{color:var(--accent);font-weight:700;white-space:nowrap}
.pid{color:var(--muted);font-size:11.5px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:13px;padding:14px 16px;margin-bottom:12px}
.card h4{margin:0 0 2px;font-size:14px}
.card .d{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.card ul{margin:0;padding-left:17px;font-size:13px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
select,input[type=text],input[type=url],input[type=password]{background:var(--plane);color:var(--ink);
 border:1px solid var(--ring);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px}
.bar2{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.picks{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;margin:0 0 12px}
.picks label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.act{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:8px;
 font:inherit;font-size:13px;font-weight:600;padding:8px 15px;cursor:pointer}
.act:hover{filter:brightness(.93)}
.warn{border-left:3px solid var(--warn);background:var(--surface);padding:11px 14px;font-size:13px;
 border-radius:0 8px 8px 0;margin:14px 0;max-width:70ch}
.note{font-size:12px;color:var(--muted);max-width:72ch}
/* newsletter page */
.nlpage{--nlc:var(--accent);background:#fff;color:#151922;border:1px solid var(--ring);border-radius:14px;
 padding:20px 22px;margin:0 0 18px}
.nlmast{display:flex;gap:10px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;
 border-bottom:3px solid var(--nlc);padding-bottom:8px;margin-bottom:13px}
.nlmast .school{font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--nlc)}
.nlmast h3{margin:1px 0 0;font-size:25px;line-height:1.06;letter-spacing:-.02em;color:#151922}
.nlmast .wk{text-align:right;font-size:11.5px;color:#5d6675}
.nlmast .wk b{display:block;font-size:15px;color:#151922}
.nlcols{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
.nlsec{margin:0 0 11px}
.nlsec h5{margin:0 0 5px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--nlc);
 font-weight:800;border-bottom:1px solid #e7ebf2;padding-bottom:3px}
.nlsec p,.nlsec li{font-size:11.8px;line-height:1.45;color:#252b36}
.nlsec ul{margin:0;padding-left:15px}
@media(max-width:840px){.nlcols{grid-template-columns:1fr}.barrow{grid-template-columns:1fr}.barlab{text-align:left}}
@media print{.shellbar,.bar2,.picks,.tabs{display:none}.nlpage{border:0;padding:0}}
</style>
</head>
<body>
<div class="shellbar">
  <span class="brand">Class Map</span>
  <div class="coursepick" id="pick"></div>
  <span class="spacer"></span>
  <span class="pill" id="sync"><span class="dot" id="syncdot"></span><span id="synctxt">not connected</span></span>
  <button class="ghost" id="theme">Dark mode</button>
</div>
<div class="wrap"><div id="view"></div></div>

<script>
const D=JSON.parse(document.getElementById('payload').textContent);
const NS='aosmap.';

const S=(k,v)=>localStorage.setItem(NS+k,v);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const VIEWS=[
 {id:'over',n:'Overview',g:'all courses'},
 {id:'advisory',n:'Advisory',g:'Grade 11'},

 {id:'act',n:'ACT Math',g:'by score band'},

 {id:'set',n:'Settings',g:'connection'}];
const COURSES=['advisory','geo','csp','alg2','act','qr'];

let view=G('view')||'over', tab=0, q='';

/* ---------- theme ---------- */
if(G('theme')==='dark')document.documentElement.dataset.theme='dark';
document.getElementById('theme').onclick=()=>{
  const d=document.documentElement.dataset.theme==='dark';
  document.documentElement.dataset.theme=d?'light':'dark';
  S('theme',d?'light':'dark');paintTheme()};
function paintTheme(){document.getElementById('theme').textContent=
  document.documentElement.dataset.theme==='dark'?'Light mode':'Dark mode'}

/* ---------- service (Apps Script) ---------- */
function svcReady(){return !!(G('url')&&G('code'))}
function svcGet(action,extra){
  const u=G('url')+'?code='+encodeURIComponent(G('code'))+'&action='+action+
    (extra||'')+'&t='+Date.now();
  return fetch(u,{redirect:'follow'}).then(r=>r.json());
}
function svcPost(body){
  return fetch(G('url'),{method:'POST',redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({code:G('code')},body))}).then(r=>r.json());
}
function paintSync(state,msg){
  const d=document.getElementById('syncdot'),t=document.getElementById('synctxt');
  d.className='dot'+(state==='ok'?' on':state==='err'?' err':'');t.textContent=msg;
}
function ping(){
  if(!svcReady())return paintSync('','not connected');
  paintSync('','checking…');
  svcGet('ping').then(j=>{
    if(!j||!j.ok)return paintSync('err',(j&&j.error)||'refused');
    paintSync('ok',(j.who||'connected')+(j.quota!=null?' · '+j.quota+' emails left':''));
  }).catch(()=>paintSync('err','offline'));
}

/* ---------- shell ---------- */
function shell(){
  document.getElementById('pick').innerHTML=VIEWS.map(v=>
    `<button data-v="${v.id}" aria-current="${v.id===view}">${esc(v.n)}<small>${esc(v.g)}</small></button>`).join('');
}
document.getElementById('pick').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;view=b.dataset.v;S('view',view);tab=0;q='';shell();render()};

/* ---------- data helpers ---------- */
const bank=c=>D.bank[c]||[];
const cats=c=>{const m={};bank(c).forEach(r=>{(m[r[6]||'Other']=m[r[6]]||[]).push(r)});return m};
function rowsTable(list){
  const f=list.filter(r=>!q||(r[2]+' '+r[4]+' '+r[6]).toLowerCase().includes(q));
  if(!f.length)return `<p class="note" style="padding:24px 0">Nothing matches “${esc(q)}”.</p>`;
  let last='',h='<table><thead><tr><th style="width:74px">Code</th><th>Title</th><th style="width:88px">Source</th><th style="width:64px">ID</th></tr></thead><tbody>';
  f.forEach(r=>{const g=r[6]||'Other';
    if(g!==last){last=g;h+=`<tr class="grp"><td colspan="4">${esc(g)}</td></tr>`}
    const t=r[3]?`<a href="${esc(r[3])}" target="_blank" rel="noopener">${esc(r[2])}</a>`:esc(r[2]);
    h+=`<tr><td class="sk code">${esc(r[4])}</td><td>${t}</td><td class="pid">${esc(D.srcs[r[0]])}</td><td class="pid code">${esc(r[5])}</td></tr>`});
  return h+`</tbody></table><p class="note" style="margin-top:8px">${f.length} of ${list.length} items.</p>`;
}

/* ---------- views ---------- */
function overview(){
  const tot=COURSES.reduce((a,c)=>a+bank(c).length,0);
  const st=[[6,'courses'],[tot,'catalogued items'],[D.weeks.length,'weeks of pacing'],
    [bank('alg2').length,'Algebra 2 skills'],[bank('geo').length,'Geometry skills'],[bank('act').length,'ACT skills']];
  let h=`<h2>2026–27 at a glance</h2>
  <p class="lede">Six courses at LISA Academy Arkansas Online School. Curriculum content is public and lives in this page; roster and family data stay in Google Sheets and are fetched only when you connect the service.</p>
  <div class="stats">${st.map(s=>`<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>
  <div class="legend"><span><b style="background:var(--ok)"></b>Catalogued</span>
   <span><b style="background:var(--warn)"></b>Partial — needs content</span>
   <span><b style="background:var(--bad)"></b>Empty</span></div>
  <div class="bars">`;
  const max=Math.max(...COURSES.map(c=>bank(c).length),1);
  COURSES.forEach(c=>{
    const n=bank(c).length,pct=Math.round(n/max*100);
    const cls=n===0?'r':n<50?'y':'g';
    h+=`<div class="barrow"><div class="barlab">${esc(CNAME[c])}<small>${n} items</small></div>
      <div class="bar"><i class="${cls}" style="width:${Math.max(pct,n?6:100)}%">${n?n:'no content yet'}</i></div></div>`;
  });
  return h+`</div><p class="note" style="margin-top:12px">Advisory carries no skill catalogue by design — its tools are the newsletter and family email.</p>`;
}
function course(id){
  const T=id==='alg2'?['Pacing','Catalogue','Schoology']:['Catalogue','Schoology'];
  if(tab>=T.length)tab=0;
  let h=`<h2>${esc(CNAME[id])}</h2><p class="lede">${bank(id).length} cataloged items · Schoology section ${esc(D.sections[id])}</p>
  <div class="tabs">${T.map((t,i)=>`<button class="tab" data-t="${i}" aria-selected="${i===tab}">${esc(t)}</button>`).join('')}</div>`;
  const n=T[tab];
  if(n==='Schoology')return h+schoology(id);
  if(n==='Pacing')return h+pacing();
  h+=`<input class="search" placeholder="Filter this catalogue…" value="${esc(q)}" id="q">`;
  return h+(bank(id).length?rowsTable(bank(id)):
    `<div class="warn">No catalogue loaded for this course yet. Add rows to the content tab in your spreadsheet, or send the source documents and they will be indexed here.</div>`);
}
function pacing(){
  const f=D.weeks.filter(w=>!q||w.items.some(i=>i.toLowerCase().includes(q)));
  return `<input class="search" placeholder="Filter weeks…" value="${esc(q)}" id="q">`+
   (f.length?f.map(w=>`<div class="card"><h4>Week ${w.week}</h4><div class="d">${esc(w.dates)}</div>
    <ul>${w.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')
   :`<p class="note">No week matches “${esc(q)}”.</p>`)+
   `<p class="note">From the 2026–27 district pacing guide. Lesson placement is title-based — verify against the Teacher Edition.</p>`;
}
function schoology(id){
  const s=D.sections[id];
  return `<p class="note">Section <span class="code">${esc(s)}</span> ·
   <a href="https://learnlisaacademy.schoology.com/course/${s}/materials" target="_blank" rel="noopener">open materials</a></p>
  <div class="warn"><b>Folder publishing works by import package, not API.</b>
   Build a week's resource list in Weekly plans, download the Schoology ZIP, then use
   Add Materials → Import to drop it into the week folder. No API key is involved.</div>`;
}
function plans(){
  const wk=+(G('week')||1);
  const w=D.weeks.find(x=>x.week===wk)||D.weeks[0];
  let h=`<h2>Weekly lesson plans</h2>
  <p class="lede">Monday to Thursday carry one lesson a day. Friday is Intervention Day, built from that week's lessons. Standards, differentiation tiers and IXL targets come from each course catalogue.</p>
  <div class="bar2">

     D.weeks.map(x=>`<option value="${x.week}"${x.week===wk?' selected':''}>Week ${x.week} · ${esc(x.dates)}</option>`).join('')}</select></div>

  </div>`;
  COURSES.forEach(c=>{
    const items=(c==='alg2'&&w)?w.items:[];
    const pool=bank(c).slice((wk-1)*4,(wk-1)*4+4);
    h+=`<div class="card"><h4>${esc(CNAME[c])}</h4>
     <div class="d">Week ${wk} · ${esc(w?w.dates:'')}</div>
     <table><thead><tr><th style="width:92px">Day</th><th>Lesson</th><th style="width:34%">Resources</th></tr></thead><tbody>`;
    ['Monday','Tuesday','Wednesday','Thursday'].forEach((d,i)=>{
      const les=items[i]||(pool[i]?pool[i][2]:'—');
      const res=pool[i]?`<a href="${esc(pool[i][3])}" target="_blank" rel="noopener">${esc(pool[i][4])} ${esc(pool[i][2])}</a>`:'<span class="pid">add from catalogue</span>';
      h+=`<tr><td class="sk">${d}</td><td>${esc(les)}</td><td>${res}</td></tr>`});
    h+=`<tr><td class="sk">Friday</td><td><b>Intervention Day</b> — reteach from this week's lessons; tiered practice by SmartScore.</td><td class="pid">IXL targets from the week above</td></tr>`;
    h+='</tbody></table></div>';
  });
  return h+`<div class="warn">Day assignment is provisional for every course except Algebra 2, which follows the district pacing guide. Load each course's weekly sequence to replace the placeholder rows.</div>`;
}
const NLSECS=[['unit','Unit'],['les','Lessons'],['std','Standards'],['asg','Assignments'],
 ['prac','Practice at home'],['voc','Vocabulary'],['ask','Ask your student'],['rem','Reminders'],['teach','From the teacher']];
function news(){
  const wk=+(G('week')||1), c=G('nlcourse')||'alg2';
  const w=D.weeks.find(x=>x.week===wk)||D.weeks[0];
  const on=k=>G('nl.'+k)!=='0';
  const pool=bank(c).slice((wk-1)*5,(wk-1)*5+5);
  let h=`<h2>Weekly newsletter</h2>
  <p class="lede">One page per class, built from the catalogue. Print it, save it as a PDF, or copy it into an email to families.</p>
  <div class="bar2">
   <div class="field"><label for="ncsel">Class</label><select id="ncsel">${
     COURSES.map(x=>`<option value="${x}"${x===c?' selected':''}>${esc(CNAME[x])}</option>`).join('')}</select></div>
   <div class="field"><label for="nwsel">Week</label><select id="nwsel">${
     D.weeks.map(x=>`<option value="${x.week}"${x.week===wk?' selected':''}>Week ${x.week} · ${esc(x.dates)}</option>`).join('')}</select></div>
   <button class="ghost" id="print">Print / save PDF</button>
  </div>
  <div class="picks">${NLSECS.map(s=>`<label><input type="checkbox" data-nl="${s[0]}"${on(s[0])?' checked':''}> ${s[1]}</label>`).join('')}</div>
  <div class="nlpage"><div class="nlmast">
    <div><div class="school">LISA Academy Arkansas Online School</div><h3>${esc(CNAME[c])}</h3></div>
    <div class="wk"><b>Week ${wk}</b>${esc(w?w.dates:'')}</div></div>
   <div class="nlcols"><div>`;
  if(on('unit'))h+=`<div class="nlsec"><h5>This week</h5><p>${esc(c==='alg2'&&w?w.items.slice(0,2).join(' · '):'Work continues in '+CNAME[c]+'.')}</p></div>`;
  if(on('les'))h+=`<div class="nlsec"><h5>Lessons</h5><ul>${
    (c==='alg2'&&w?w.items:pool.map(p=>p[2])).map(i=>`<li>${esc(i)}</li>`).join('')||'<li>—</li>'}</ul></div>`;
  if(on('std'))h+=`<div class="nlsec"><h5>Standards</h5><p>Arkansas 2023 standards for this unit. Codes appear on every assignment in Schoology.</p></div>`;
  if(on('asg'))h+=`<div class="nlsec"><h5>Assignments</h5><ul>${
    pool.map(p=>`<li>${esc(p[4])} ${esc(p[2])}</li>`).join('')||'<li>Posted in Schoology</li>'}</ul></div>`;
  h+=`</div><div>`;
  if(on('prac'))h+=`<div class="nlsec"><h5>Practice at home</h5><ul>${
    pool.slice(0,3).map(p=>`<li>IXL ${esc(p[4])} — ${esc(p[2])}</li>`).join('')||'<li>IXL skills posted weekly</li>'}</ul>
    <p>Aim for a SmartScore of 80 on each skill.</p></div>`;
  if(on('voc'))h+=`<div class="nlsec"><h5>Vocabulary</h5><p>Terms for this unit are listed in the Schoology week folder.</p></div>`;
  if(on('ask'))h+=`<div class="nlsec"><h5>Ask your student</h5><ul><li>What was the hardest problem this week, and why?</li><li>Show me one thing you learned.</li></ul></div>`;
  if(on('rem'))h+=`<div class="nlsec"><h5>Reminders</h5><ul><li>Live sessions meet on the posted BigBlueButton schedule.</li><li>Late work follows the syllabus policy.</li></ul></div>`;
  if(on('teach'))h+=`<div class="nlsec"><h5>From the teacher</h5><p>Questions are always welcome — reply to this newsletter or email aarduc@lisaacademy.org.</p></div>`;
  return h+`</div></div></div>`;
}
function mail(){
  if(!svcReady())return `<h2>Family email</h2>
   <p class="lede">Sends through your own Apps Script web app, using your school Gmail. Roster data is never stored in this page or in the repository.</p>
   <div class="warn"><b>Not connected.</b> Open Settings and enter your web app URL and access code. Until then this panel stays empty — it will not invent a roster.</div>
   <p class="note">Your <span class="code">AOS G11 Advisory Family Mailer</span> already reads <span class="code">All Students 8.26</span> and logs to <span class="code">Advisory Email Log</span>. It needs a <span class="code">doGet</span>/<span class="code">doPost</span> wrapper answering <span class="code">ping</span>, <span class="code">roster</span> and <span class="code">list</span> before this page can drive it.</p>`;
  const sel=(G('mcls')||'advisory').split(',').filter(Boolean);
  return `<h2>Family email</h2>
   <p class="lede">Sends one personalised message per guardian, from your school Gmail, and writes every send to <span class="code">Advisory Email Log</span>. Student addresses are never used.</p>
   <label style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700">Classes</label>
   <div class="picks" style="margin:6px 0 10px">${
     COURSES.map(x=>`<label><input type="checkbox" class="ccls" value="${x}"${sel.indexOf(x)>=0?' checked':''}> ${esc(CNAME[x])}</label>`).join('')}
     <button class="ghost" id="callc" style="padding:3px 9px">All six</button></div>
   <div class="bar2"><button class="ghost" id="loadr">Load guardians</button>
     <span class="note" id="cnote">Each guardian is emailed once, however many of these classes their children are in.</span></div>
   <div class="field" style="margin-bottom:10px"><label for="msubj">Subject</label>
    <input id="msubj" type="text" value="${esc(G('msubj'))}" placeholder="Week 6 update for {{student}}"></div>
   <div class="field" style="margin-bottom:6px"><label for="mbody">Message</label>
    <textarea id="mbody" rows="11" style="background:var(--plane);color:var(--ink);border:1px solid var(--ring);border-radius:8px;padding:9px 11px;font:inherit;font-size:13px;line-height:1.55">${esc(G('mbody'))}</textarea></div>
   <p class="note" style="margin-bottom:14px">Placeholders: <span class="code">{{student}}</span> <span class="code">{{guardian}}</span> <span class="code">{{grade}}</span> <span class="code">{{class}}</span>. Line breaks become paragraphs. Basic HTML is allowed.</p>
   <div class="bar2">
    <button class="ghost" id="mtest">Send one to me</button>
    <button class="ghost" id="mdry">Dry run — who would get this</button>
    <button class="act" id="msend">Send to class</button>
   </div>
   <div id="mlog" class="note" style="margin-top:12px"></div>
   <div id="mlist"></div>
   <div class="warn"><b>There is no undo.</b> Use <i>Send one to me</i> first and read the result in your own inbox. <i>Dry run</i> lists recipients without sending anything.</div>`;
}
function settings(){
  return `<h2>Settings</h2><p class="lede">Stored in this browser only. Nothing here is written to the repository.</p>
  <div style="display:grid;gap:14px;max-width:560px">
  <div class="field"><label for="url">Apps Script web app URL</label>
   <input id="url" type="url" value="${esc(G('url'))}" placeholder="https://script.google.com/macros/s/…/exec"></div>
  <div class="field"><label for="code">Access code</label>
   <input id="code" type="password" value="${esc(G('code'))}" placeholder="shared secret set in your script"></div>
  <div><button class="act" id="save">Save and test</button></div></div>
  <p class="note" style="margin-top:10px">Deploy the script with <b>Execute as: me</b> and <b>Access: anyone with the link</b>, then guard it with the access code above. The code is checked server-side on every request.</p>
  <div class="warn"><b>Never put your Schoology consumer secret in this page.</b>
   This site is world-readable on github.io. Secrets belong in Apps Script under Project Settings → Script Properties.</div>
  <p class="note">Spreadsheet <span class="code">All Students 8.26</span> · Drive folder <span class="code">Documents Uploaded</span> — both are referenced by the script, not by this page.</p>`;
}

/* ---------- render ---------- */
function render(){
  const v=document.getElementById('view');
  v.innerHTML = view==='over'?overview() : view==='plans'?plans() : view==='news'?news()
    : view==='mail'?mail() : view==='set'?settings() : course(view);
  bind();
}
function bind(){
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=+b.dataset.t;q='';render()});
  const qq=document.getElementById('q');
  if(qq)qq.oninput=e=>{q=e.target.value.trim().toLowerCase();const p=e.target.selectionStart;render();
    const n=document.getElementById('q');if(n){n.focus();n.setSelectionRange(p,p)}};
  const ws=document.getElementById('wsel')||document.getElementById('nwsel');
  if(ws)ws.onchange=e=>{S('week',e.target.value);render()};
  const nc=document.getElementById('ncsel');
  if(nc)nc.onchange=e=>{S('nlcourse',e.target.value);render()};
  const pv=document.getElementById('prevw'),nx=document.getElementById('nextw');
  if(pv)pv.onclick=()=>{S('week',Math.max(1,+(G('week')||1)-1));render()};
  if(nx)nx.onclick=()=>{S('week',Math.min(D.weeks.length,+(G('week')||1)+1));render()};
  document.querySelectorAll('[data-nl]').forEach(cb=>cb.onchange=()=>{
    S('nl.'+cb.dataset.nl,cb.checked?'1':'0');render()});
  const pr=document.getElementById('print');if(pr)pr.onclick=()=>window.print();
  const sv=document.getElementById('save');
  if(sv)sv.onclick=()=>{S('url',document.getElementById('url').value.trim());
    S('code',document.getElementById('code').value.trim());ping();
    sv.textContent='Saved';setTimeout(()=>sv.textContent='Save and test',1400)};
  const chosen=()=>[...document.querySelectorAll('.ccls:checked')].map(c=>c.value);
  document.querySelectorAll('.ccls').forEach(c=>c.onchange=()=>S('mcls',chosen().join(',')));
  const ca=document.getElementById('callc');
  if(ca)ca.onclick=()=>{document.querySelectorAll('.ccls').forEach(c=>c.checked=true);
    S('mcls',chosen().join(','));};
  const sj=document.getElementById('msubj'),bd=document.getElementById('mbody');
  if(sj)sj.oninput=e=>S('msubj',e.target.value);
  if(bd)bd.oninput=e=>S('mbody',e.target.value);
  const say=t=>{const l=document.getElementById('mlog');if(l)l.textContent=t};
  const compose=()=>({cls:chosen(),
    subject:document.getElementById('msubj').value.trim(),
    html:document.getElementById('mbody').value.trim()
      .split(/\n{2,}/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('')});
  const lr=document.getElementById('loadr');
  const drawList=rows=>{
    window.__rows=rows;
    document.getElementById('mlist').innerHTML=
      `<div class="bar2" style="margin:14px 0 6px"><button class="ghost" id="mall">Select all</button>
       <button class="ghost" id="mnone">Select none</button>
       <span class="note" id="mcount"></span></div>
      <table><thead><tr><th style="width:38px"></th><th>Guardian</th><th>Email</th><th>Student</th></tr></thead><tbody>`+
      rows.map((r,i)=>`<tr><td><input type="checkbox" class="mchk" data-e="${esc(r.to)}" checked></td>
        <td>${esc(r.name)}</td><td class="pid">${esc(r.to)}</td><td>${esc(r.student)}${r.n>1?' <span class="pid">('+r.n+')</span>':''}</td></tr>`).join('')+
      '</tbody></table>';
    const upd=()=>{const n=document.querySelectorAll('.mchk:checked').length;
      document.getElementById('mcount').textContent=n+' of '+rows.length+' selected';};
    document.querySelectorAll('.mchk').forEach(c=>c.onchange=upd);
    document.getElementById('mall').onclick=()=>{document.querySelectorAll('.mchk').forEach(c=>c.checked=true);upd()};
    document.getElementById('mnone').onclick=()=>{document.querySelectorAll('.mchk').forEach(c=>c.checked=false);upd()};
    upd();
  };
  const skipMap=()=>{const s={};
    document.querySelectorAll('.mchk').forEach(c=>{if(!c.checked)s[c.dataset.e.toLowerCase()]=1});
    return s};
  if(lr)lr.onclick=()=>{const c=chosen();
    if(!c.length)return say('Tick at least one class.');
    say('Loading…');
    svcGet('list','&cls='+encodeURIComponent(c.join(','))+'&to=guardians').then(j=>{
      if(!j||!j.ok)return say('The service answered: '+((j&&j.error)||'no'));
      const multi=(j.rows||[]).filter(r=>r.n>1).length;
      say((j.rows||[]).length+' guardians, each listed once'+
        (multi?' — '+multi+' of them have more than one of your students':'')+
        '. Untick anyone who should not receive this.');
      drawList(j.rows||[]);
    }).catch(()=>say('Could not reach the service.'))};
  const mt=document.getElementById('mtest');
  if(mt)mt.onclick=()=>{const c=compose();
    if(!c.subject||!c.html)return say('Add a subject and a message first.');
    say('Sending one to you…');
    svcPost(Object.assign({action:'send',testOnly:true},c)).then(j=>
      say(j&&j.ok?('Sent to you. Check your inbox — quota now '+j.quota+'.'):'Refused: '+((j&&j.error)||'no')))
      .catch(()=>say('Could not reach the service.'))};
  const md=document.getElementById('mdry');
  if(md)md.onclick=()=>{const c=compose();
    if(!c.subject||!c.html)return say('Add a subject and a message first.');
    say('Checking…');
    svcPost(Object.assign({action:'send',dryRun:true,skip:skipMap()},c)).then(j=>{
      if(!j||!j.ok)return say('Refused: '+((j&&j.error)||'no'));
      say(j.would+' guardians would receive this. Nothing was sent.');
    }).catch(()=>say('Could not reach the service.'))};
  const ms=document.getElementById('msend');
  if(ms)ms.onclick=()=>{const c=compose();
    if(!c.subject||!c.html)return say('Add a subject and a message first.');
    if(!confirm('Send this to '+(document.querySelectorAll('.mchk:checked').length||'all')+' guardians across '+c.cls.length+' class(es)?\n\nThis cannot be undone.'))return;
    say('Sending…');ms.disabled=true;
    svcPost(Object.assign({action:'send',skip:skipMap()},c)).then(j=>{ms.disabled=false;
      say(j&&j.ok?('Sent '+j.sent+(j.failed?', '+j.failed+' failed':'')+'. Batch '+j.batch+' is in the log. Quota now '+j.quota+'.')
        :'Refused: '+((j&&j.error)||'no'))})
      .catch(()=>{ms.disabled=false;say('Could not reach the service.')})};
}
paintTheme();shell();render();ping();
</script>
</body>
