<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Map — LISA Academy Arkansas Online School</title>
<style>
:root{
  --paper:#FBFBFD; --ink:#16181D; --slate:#5B6472; --rule:#E3E6EC; --hover:#F1F3F7;
  --advisory:#7A3E9D; --geo:#0F7B6C; --csp:#1D5FA8; --alg2:#B4451F; --act:#8A6D0B; --qr:#A02455;
  --accent:var(--alg2);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
code,.code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
.wrap{display:grid;grid-template-columns:200px 1fr;min-height:100vh}

/* left rail */
nav{border-right:1px solid var(--rule);padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
nav h1{font-size:15px;margin:0 16px 2px;letter-spacing:-.01em}
nav p{margin:0 16px 20px;font-size:12px;color:var(--slate)}
.crs{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;
  padding:7px 16px 7px 13px;border-left:3px solid transparent;color:var(--ink);font:inherit;font-size:14px}
.crs:hover{background:var(--hover)}
.crs[aria-current="true"]{border-left-color:var(--c);font-weight:600}
.crs small{display:block;font-size:11px;color:var(--slate);font-weight:400}
nav hr{border:0;border-top:1px solid var(--rule);margin:16px 16px}

/* main */
main{padding:28px 32px 80px;max-width:1080px}
.search{width:100%;max-width:560px;padding:11px 14px;font:inherit;font-size:16px;
  border:1px solid var(--rule);border-radius:7px;background:#fff}
.search:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
h2{font-size:23px;margin:0 0 4px;letter-spacing:-.015em}
.sub{color:var(--slate);font-size:13px;margin:0 0 22px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin:22px 0 20px;flex-wrap:wrap}
.tab{border:0;background:none;font:inherit;font-size:14px;color:var(--slate);cursor:pointer;
  padding:8px 12px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--slate);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--rule)}
td{padding:6px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:hover td{background:var(--hover)}
.pid{color:var(--slate);font-size:12px}
.sk{color:var(--accent);font-weight:600;white-space:nowrap}
.grp{background:var(--hover);font-weight:600;font-size:13px}
.wk{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:#fff}
.wk h4{margin:0 0 3px;font-size:14px}
.wk .d{font-size:12px;color:var(--slate);margin-bottom:7px}
.wk ul{margin:0;padding-left:18px;font-size:13.5px}
.wk li{margin:2px 0}
.hit{font-size:11px;color:var(--slate);border:1px solid var(--rule);border-radius:4px;padding:1px 5px;margin-left:6px}
.empty{color:var(--slate);padding:28px 0;font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 4px}
input[type=text],input[type=url]{width:100%;max-width:560px;padding:8px 10px;font:inherit;font-size:14px;
  border:1px solid var(--rule);border-radius:6px;background:#fff}
.note{font-size:12.5px;color:var(--slate);margin:4px 0 0;max-width:560px}
button.act{font:inherit;font-size:14px;padding:8px 15px;border-radius:6px;border:1px solid var(--accent);
  background:var(--accent);color:#fff;cursor:pointer;margin-top:16px}
button.act:hover{filter:brightness(.92)}
.warn{border-left:3px solid var(--accent);background:#fff;padding:11px 14px;font-size:13.5px;max-width:640px;margin:16px 0}
@media(max-width:760px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule)}main{padding:20px 16px 60px}}
@media(prefers-reduced-motion:no-preference){.wk{transition:border-color .12s}}
</style>
</head>
<body>
<div class="wrap">
<nav>
  <h1>Class Map</h1>
  <p>LISA Academy Arkansas Online School<br>2026&ndash;27</p>
  <div id="rail"></div>
  <hr>
  <button class="crs" data-c="settings">Settings</button>
</nav>
<main>
  <input class="search" id="q" type="search" placeholder="Search skills, lessons, standards…" autocomplete="off">
  <div id="body"></div>
</main>
</div>

pid":"2BA"},{"name":"Area between two shapes","pid":"SB6"},{"name":"Heron's formula","pid":"KU2"}],"Statistics and Probability":[{"name":"Mean, median, and mode","pid":"7E3"},{"name":"Write a discrete probability distribution","pid":"RH6"},{"name":"Experiment design","pid":"BKR"},{"name":"Find conditional probabilities","pid":"2M4"},{"name":"Independence and conditional probability","pid":"AJC"},{"name":"Find probabilities using the addition rule","pid":"B9L"},{"name":"Identify biased samples","pid":"CH7"}]}}],"csp":[{"n":"1","t":"Creative Development"},{"n":"2","t":"Data"},{"n":"3","t":"Algorithms and Programming"},{"n":"4","t":"Computer Systems and Networks"},{"n":"5","t":"Impact of Computing"}],"sections":{"advisory":"8473154226","geo":"8473154281","csp":"8473154373","alg2":"8473154276","act":"8473154318","qr":"8473154314"}}</script>
<script>
const D=JSON.parse(document.getElementById('payload').textContent);
const C=[
 {id:'advisory',n:'Advisory',g:'Grade 11',v:'--advisory'},
 {id:'geo',n:'Pre-AP Geometry',g:'with Statistics',v:'--geo'},
 {id:'csp',n:'AP CSP',g:'Computer Science Principles',v:'--csp'},
 {id:'alg2',n:'Algebra 2',g:'Reveal Math',v:'--alg2'},
 {id:'act',n:'ACT Math',g:'Test prep',v:'--act'},
 {id:'qr',n:'Quantitative Reasoning',g:'Units 1–4',v:'--qr'}];
let cur='alg2',tab=0,q='';
const S=k=>localStorage.getItem(k)||'';
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const hl=s=>q?esc(s).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'):esc(s);
const ixlUrl=p=>'https://www.ixl.com/math/skill/'+p;

function rail(){
  document.getElementById('rail').innerHTML=C.map(c=>
    `<button class="crs" data-c="${c.id}" style="--c:var(${c.v})" aria-current="${c.id===cur}">
      ${esc(c.n)}<small>${esc(c.g)}</small></button>`).join('');
}
function tabsOf(id){
  return {advisory:['Families','Schoology'],geo:['IXL skills','Schoology'],
    csp:['Big ideas','Schoology'],alg2:['Pacing','IXL skills','Schoology'],
    act:['By score band','Schoology'],qr:['Units','Schoology']}[id]||[];
}
function ixlTable(list){
  const f=list.filter(s=>!q||(s.name+' '+s.skill+' '+s.cat).toLowerCase().includes(q));
  if(!f.length)return `<p class="empty">No skill matches “${esc(q)}”.</p>`;
  let last='',h='<table><thead><tr><th style="width:62px">Skill</th><th>Name</th><th style="width:70px">ID</th></tr></thead><tbody>';
  f.forEach(s=>{if(s.cat!==last){last=s.cat;h+=`<tr class="grp"><td colspan="3">${hl(s.cat)}</td></tr>`}
    h+=`<tr><td class="sk code">${esc(s.skill)}</td><td><a href="${ixlUrl(s.pid)}" target="_blank" rel="noopener">${hl(s.name)}</a></td><td class="pid code">${esc(s.pid)}</td></tr>`});
  return h+'</tbody></table>'+`<p class="note">${f.length} of ${list.length} skills. Links open the IXL skill directly.</p>`;
}
function schoology(id){
  const sec=D.sections[id];
  return `<p class="note" style="margin-bottom:14px">Course section <code>${sec}</code> on learnlisaacademy.schoology.com.</p>
  <p><a href="https://learnlisaacademy.schoology.com/course/${sec}/materials" target="_blank" rel="noopener">Open course materials</a></p>
  <div class="warn"><strong>Folder publishing is not connected yet.</strong>
  Add your Apps Script web app URL under Settings, then this panel will list weekly folders and let you push IXL links, CK-12 lessons, and uploaded files into them.</div>`;
}
function render(){
  const c=C.find(x=>x.id===cur);
  document.documentElement.style.setProperty('--accent',c?`var(${c.v})`:'var(--alg2)');
  const b=document.getElementById('body');
  if(cur==='settings'){b.innerHTML=settings();bind();return}
  const T=tabsOf(cur);if(tab>=T.length)tab=0;
  let h=`<h2>${esc(c.n)}</h2><p class="sub">${esc(c.g)}</p>
  <div class="tabs" role="tablist">${T.map((t,i)=>`<button class="tab" role="tab" data-t="${i}" aria-selected="${i===tab}">${t}</button>`).join('')}</div>`;
  const name=T[tab];
  if(name==='Schoology')h+=schoology(cur);
  else if(cur==='alg2'&&name==='Pacing')h+=pacing();
  else if(cur==='alg2')h+=ixlTable(D.ixl.alg2);
  else if(cur==='geo')h+=ixlTable(D.ixl.geo);
  else if(cur==='act')h+=actBands();
  else if(cur==='qr')h+=qr();
  else if(cur==='csp')h+=csp();
  else if(cur==='advisory')h+=advisory();
  b.innerHTML=h;bind();
}
function pacing(){
  const f=D.weeks.filter(w=>!q||w.items.some(i=>i.toLowerCase().includes(q))||('week '+w.week).includes(q));
  if(!f.length)return `<p class="empty">No week matches “${esc(q)}”.</p>`;
  return f.map(w=>`<div class="wk"><h4>Week ${w.week}</h4><div class="d">${esc(w.dates||'')}</div>
    <ul>${w.items.map(i=>`<li>${hl(i)}</li>`).join('')}</ul></div>`).join('')
    +`<p class="note">${f.length} of ${D.weeks.length} weeks from the 2026–27 district pacing guide. Lesson placement is title-based — verify against your Teacher Edition.</p>`;
}
function actBands(){
  let out='';
  D.act.forEach(b=>{
    const doms=Object.entries(b.domains).map(([d,sk])=>{
      const f=sk.filter(s=>!q||s.name.toLowerCase().includes(q)||d.toLowerCase().includes(q));
      return f.length?`<tr class="grp"><td colspan="2">${hl(d)}</td></tr>`+
        f.map(s=>`<tr><td><a href="${ixlUrl(s.pid)}" target="_blank" rel="noopener">${hl(s.name)}</a></td><td class="pid code">${esc(s.pid)}</td></tr>`).join(''):''});
    const rows=doms.join('');
    if(rows)out+=`<h3 style="font-size:16px;margin:22px 0 8px">Score range ${esc(b.band)}</h3><table><tbody>${rows}</tbody></table>`;
  });
  return out||`<p class="empty">No ACT skill matches “${esc(q)}”.</p>`;
}
function qr(){
  const f=D.qrLessons.filter(l=>!q||(l[1]+' '+l[2]).toLowerCase().includes(q));
  if(!f.length)return `<p class="empty">No lesson matches “${esc(q)}”.</p>`;
  let h='<table><thead><tr><th style="width:52px">Lesson</th><th>Title</th><th>Focus</th><th style="width:50px">Page</th></tr></thead><tbody>';
  f.forEach(l=>h+=`<tr><td class="sk code">${esc(l[0])}</td><td>${hl(l[1])}</td><td>${hl(l[2])}</td><td class="pid code">${esc(l[3])}</td></tr>`);
  return h+'</tbody></table><p class="note">Units: '+D.qrUnits.map(u=>esc(u[1].trim())).join(' &middot; ')+'</p>';
}
function csp(){
  return '<table><thead><tr><th style="width:80px">Big idea</th><th>Title</th></tr></thead><tbody>'+
   D.csp.filter(b=>!q||b.t.toLowerCase().includes(q)).map(b=>`<tr><td class="sk code">${esc(b.n)}</td><td>${hl(b.t)}</td></tr>`).join('')+
   '</tbody></table><p class="note">From the AP CSP Course and Exam Description, effective Fall 2023. Learning objectives and essential knowledge statements are not loaded yet.</p>';
}
function advisory(){
  const u=S('webapp');
  return `<div class="warn"><strong>Family email is not connected yet.</strong>
  Your <em>AOS G11 Advisory Family Mailer</em> script already reads <code>All Students 8.26</code> and logs to <code>Advisory Email Log</code>. Deploy it as a web app, paste the URL under Settings, and this panel will send from here.</div>
  <p class="note">Roster data stays in the spreadsheet. It is never stored in this site or in the GitHub repository.</p>
  ${u?`<p class="note">Web app configured: <code>${esc(u.slice(0,48))}…</code></p>`:''}`;
}
function settings(){
  return `<h2>Settings</h2><p class="sub">Stored in this browser only. Nothing is written to the repository.</p>
  <label for="wa">Apps Script web app URL</label>
  <input id="wa" type="url" value="${esc(S('webapp'))}" placeholder="https://script.google.com/macros/s/…/exec">
  <p class="note">Deploy your mailer script as a web app (Execute as: me, Access: anyone within lisaacademy.org), then paste the /exec URL here.</p>
  <label for="sid">Spreadsheet ID</label>
  <input id="sid" type="text" value="${esc(S('sheet')||'19INZTFJo8kP69Zo2bmOqf4_JT_aXYW1RnLrxSvubztY')}">
  <p class="note">All Students 8.26</p>
  <label for="drv">Drive upload folder ID</label>
  <input id="drv" type="text" value="${esc(S('drive')||'1nyClakMAPLlAfh427FmrbaWt5BJDp5FW')}">
  <p class="note">Documents Uploaded</p>
  <button class="act" id="save">Save settings</button>
  <div class="warn" style="margin-top:26px"><strong>Never paste your Schoology consumer secret here.</strong>
  This page is public on github.io. The secret belongs in Apps Script under Project Settings &rarr; Script Properties, where only the server can read it.</div>`;
}
function bind(){
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=+t.dataset.t;render()});
  const s=document.getElementById('save');
  if(s)s.onclick=()=>{localStorage.setItem('webapp',document.getElementById('wa').value.trim());
    localStorage.setItem('sheet',document.getElementById('sid').value.trim());
    localStorage.setItem('drive',document.getElementById('drv').value.trim());
    s.textContent='Saved';setTimeout(()=>s.textContent='Save settings',1400)};
}
document.getElementById('rail').addEventListener('click',e=>{
  const b=e.target.closest('.crs');if(!b)return;cur=b.dataset.c;tab=0;rail();render()});
document.querySelector('nav').addEventListener('click',e=>{
  const b=e.target.closest('[data-c="settings"]');if(!b)return;cur='settings';rail();render()});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render()});
rail();render();
</script>
</body>
</html>
